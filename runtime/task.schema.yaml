$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/runtime-task.schema.yaml
title: JDGF Runtime Task
type: object
additionalProperties: false
required: [id, owner, workflow_ref, state, side_effects, approval_required]
properties:
  id: {type: string, pattern: "^[a-z][a-z0-9-]{2,62}$"}
  owner: {type: string, minLength: 1, maxLength: 200}
  workflow_ref: {type: string, pattern: "^[a-z][a-z0-9-]{2,62}$"}
  state: {enum: [proposed, validated, awaiting-approval, approved, cancelled]}
  side_effects: {const: false}
  approval_required: {const: true}
