$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/framework-core.schema.yaml
title: JDGF Framework Core Definition
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: FrameworkCore}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {enum: [active, deprecated]}
  spec:
    type: object
    additionalProperties: false
    required: [authoritative_sources, operations, invariants]
    properties:
      authoritative_sources:
        type: object
        additionalProperties: false
        required: [version, environment, framework, modules, projects]
        properties:
          version: {const: VERSION}
          environment: {const: pyproject.toml}
          framework: {const: manifests/framework.yaml}
          modules: {const: registry/modules.yaml}
          projects: {const: registry/projects.yaml}
      operations:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, lifecycle, implementation, mutating, approval_required]
          properties:
            id: {enum: [bootstrap, validate, doctor, package, update, backup, restore]}
            lifecycle: {enum: [active, deferred]}
            implementation:
              oneOf:
                - {type: string, pattern: "^[A-Za-z0-9._/-]+$"}
                - {type: "null"}
            mutating: {type: boolean}
            approval_required: {type: boolean}
      invariants:
        type: object
        additionalProperties: false
        required: [locked_environment, repository_bound, no_implicit_network_mutation]
        properties:
          locked_environment: {const: true}
          repository_bound: {const: true}
          no_implicit_network_mutation: {const: true}
