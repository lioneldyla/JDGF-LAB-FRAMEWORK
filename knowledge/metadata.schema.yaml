$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/knowledge-metadata.schema.yaml
title: JDGF Knowledge Document Metadata
type: object
additionalProperties: false
required:
  - id
  - title
  - language
  - document_type
  - source
  - checksum
properties:
  id: {$ref: "#/$defs/identifier"}
  title: {type: string, minLength: 1, maxLength: 500}
  authors:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  organization: {type: string, minLength: 1}
  language:
    type: string
    pattern: "^[a-z]{2,3}(?:-[A-Z]{2})?$"
  publication_date:
    type: string
    format: date
  document_type:
    enum: [article, book, dataset, documentation, publication, report, standard, other]
  keywords:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1, maxLength: 100}
  summary: {type: string, minLength: 1, maxLength: 5000}
  source:
    type: object
    additionalProperties: false
    required: [kind, locator]
    properties:
      kind: {enum: [file, url, repository]}
      locator: {type: string, minLength: 1}
      retrieved_at:
        type: string
        format: date-time
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  license: {type: string, minLength: 1}
  checksum:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
$defs:
  identifier:
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]{2,127}$"
