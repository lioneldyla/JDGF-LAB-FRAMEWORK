$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/knowledge-platform.schema.yaml
title: JDGF Knowledge Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: knowledge-platform}
      name: {const: Knowledge Platform}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - registry
      - components
      - corpus_committed
      - adapters_enabled
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/knowledge.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [ontology, metadata, collections, indexing, ingestion, rag, graph, vectors]}
      corpus_committed: {const: false}
      adapters_enabled: {type: boolean}
