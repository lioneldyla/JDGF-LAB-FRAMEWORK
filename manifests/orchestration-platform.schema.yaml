$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/orchestration-platform.schema.yaml
title: JDGF Orchestration Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: orchestration-platform}
      name: {const: Orchestration Platform}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - orchestrator_registry
      - workflow_registry
      - router
      - components
      - agents_enabled
      - execution_enabled
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      orchestrator_registry: {const: registry/orchestrators.yaml}
      workflow_registry: {const: registry/workflows.yaml}
      router: {const: orchestration/router.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [orchestrator, router, workflows, routing, human-gates, audit]}
      agents_enabled: {const: false}
      execution_enabled: {const: false}
