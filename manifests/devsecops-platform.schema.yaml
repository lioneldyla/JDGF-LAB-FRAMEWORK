$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/devsecops-platform.schema.yaml
title: JDGF DevSecOps Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: devsecops-platform}
      name: {const: DevSecOps Platform}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - registry
      - config
      - components
      - deployment_enabled
      - release_publishing_enabled
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/devsecops.yaml}
      config: {const: devsecops/devsecops.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [github-actions, dependency-updates, ci, security, quality, packaging, release-candidates]}
      deployment_enabled: {const: false}
      release_publishing_enabled: {const: false}
