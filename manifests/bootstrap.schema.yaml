$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/bootstrap-manifests.schema.yaml
title: JDGF Bootstrap Manifest
oneOf:
  - $ref: "#/$defs/framework"
  - $ref: "#/$defs/modules"
  - $ref: "#/$defs/projects"
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  framework:
    type: object
    additionalProperties: false
    required: [api_version, kind, metadata, spec]
    properties:
      api_version: {const: jdgf.io/v1alpha1}
      kind: {const: Framework}
      metadata:
        type: object
        additionalProperties: false
        required: [name, version, codename]
        properties:
          name: {const: JDGF Lab Framework}
          version:
            type: string
            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          codename: {type: string, minLength: 1}
      spec:
        type: object
        additionalProperties: false
        required:
          - status
          - architecture
          - maintainer
          - active_capabilities
          - deferred_platforms
        properties:
          status: {enum: [foundation, preview, stable, deprecated]}
          architecture: {const: modular}
          maintainer: {type: string, minLength: 1}
          active_capabilities: {$ref: "#/$defs/identifier_list"}
          deferred_platforms: {$ref: "#/$defs/identifier_list"}
  modules:
    type: object
    additionalProperties: false
    required: [api_version, kind, modules]
    properties:
      api_version: {const: jdgf.io/v1alpha1}
      kind: {const: ModuleManifest}
      modules:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, lifecycle]
          properties:
            id: {$ref: "#/$defs/identifier"}
            lifecycle: {enum: [active, specified, deferred, deprecated]}
  projects:
    type: object
    additionalProperties: false
    required: [api_version, kind, registry]
    properties:
      api_version: {const: jdgf.io/v1alpha1}
      kind: {const: ProjectRegistryReference}
      registry: {const: registry/projects.yaml}
  identifier_list:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: "#/$defs/identifier"}
