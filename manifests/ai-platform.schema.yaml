$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/ai-platform.schema.yaml
title: JDGF AI Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: ai-platform}
      name: {const: AI Platform}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - configured
      - runtime_tested
      - registry
      - components
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      configured: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/ai-services.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [ollama, litellm, open-webui, openhands]
