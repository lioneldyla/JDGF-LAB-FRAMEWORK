$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/agent-platform.schema.yaml
title: JDGF Agent Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: agent-platform}
      name: {const: Agent Platform}
      version: {$ref: "#/$defs/version"}
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - registry
      - schema
      - components
      - orchestration_enabled
      - unattended_execution
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/agents.yaml}
      schema: {const: agents/agent.schema.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [profiles, registry, permissions, routing, memory]}
      orchestration_enabled: {const: false}
      unattended_execution: {const: false}
$defs:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
