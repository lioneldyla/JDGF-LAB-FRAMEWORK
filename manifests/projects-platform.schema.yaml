$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/projects-platform.schema.yaml
title: JDGF Projects Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: projects-platform}
      name: {const: Projects Platform}
      version: {$ref: "#/$defs/version"}
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - registry
      - schema
      - components
      - external_projects_embedded
      - templates_registered
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/projects.yaml}
      schema: {const: projects/project.schema.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [project-registry, project-schema, governance, lifecycle, documentation]}
      external_projects_embedded: {const: false}
      templates_registered: {const: false}
$defs:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
