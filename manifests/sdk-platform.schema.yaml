$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/sdk-platform.schema.yaml
title: JDGF SDK Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: sdk-platform}
      name: {const: SDK and CLI Platform}
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
  spec:
    type: object
    additionalProperties: false
    required: [lifecycle, installable, runtime_tested, definition, registry, active_generators]
    properties:
      lifecycle: {enum: [active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      definition: {const: sdk/sdk.yaml}
      registry: {const: registry/sdk.yaml}
      active_generators:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [project, agent, module, plugin, workflow]}
