$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/runtime-platform.schema.yaml
title: JDGF Runtime Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: runtime-platform}
      name: {const: Runtime Control Platform}
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
  spec:
    type: object
    additionalProperties: false
    required: [lifecycle, installable, runtime_tested, execution_enabled, profile, registry, active_components]
    properties:
      lifecycle: {const: specified}
      installable: {const: false}
      runtime_tested: {const: false}
      execution_enabled: {const: false}
      profile: {const: runtime/runtime.yaml}
      registry: {const: registry/runtime.yaml}
      active_components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {const: lifecycle-controller}
