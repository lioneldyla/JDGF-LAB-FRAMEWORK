$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/database-platform.schema.yaml
title: JDGF Data Platform Manifest
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: PlatformManifest}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version]
    properties:
      id: {const: data-platform}
      name: {const: Data Platform}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - installable
      - runtime_tested
      - registry
      - components
      - healthchecks
      - backup
    properties:
      lifecycle: {enum: [specified, active, deprecated]}
      installable: {type: boolean}
      runtime_tested: {type: boolean}
      registry: {const: registry/database-services.yaml}
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [postgres, redis, neo4j, qdrant]}
      healthchecks:
        type: object
        additionalProperties: false
        required: [configured]
        properties:
          configured: {type: boolean}
      backup:
        type: object
        additionalProperties: false
        required: [documented, runtime_tested]
        properties:
          documented: {type: boolean}
          runtime_tested: {type: boolean}
