name: Docker Build & Push

on:
  push:
    branches: [ codex/advanced-rag-contracts ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/lioneldyla/jdgf-lab-framework:latest
          ghcr.io/lioneldyla/jdgf-lab-framework:${{ github.sha }}
