name: Continuous Integration

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main, "codex/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --frozen --extra dev

      - name: Lint
        run: ./scripts/devsecops/run-lint.sh

      - name: Verify framework
        run: ./verify.sh

      - name: Audit dependencies and tracked secrets
        run: ./scripts/devsecops/security-scan.sh

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: uv run pytest tests/ -v --cov=src/jdgf_framework --cov-report=xml
