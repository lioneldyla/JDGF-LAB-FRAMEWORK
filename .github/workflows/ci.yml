name: Continuous Integration

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main, "codex/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --frozen --extra dev

      - name: Lint
        run: ./scripts/devsecops/run-lint.sh

      - name: Verify framework
        run: ./verify.sh

      - name: Audit dependencies and tracked secrets
        run: ./scripts/devsecops/security-scan.sh

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/jdgf_framework --cov-report=xml
