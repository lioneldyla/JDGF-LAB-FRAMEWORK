name: Container contract validation

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "tests/test_docker_platform.py"
      - "tests/test_automation_platform.py"
      - ".github/workflows/container-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --frozen --extra dev

      - name: Render and validate Compose contracts
        run: >-
          uv run pytest -p no:cacheprovider
          tests/test_docker_platform.py
          tests/test_automation_platform.py

      - name: Validate Docker Compose files
        run: |
          find infrastructure -name "compose.yaml" -exec docker compose -f {} config \;
