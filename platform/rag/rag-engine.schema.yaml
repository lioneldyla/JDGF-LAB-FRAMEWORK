$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/rag-engine.schema.yaml
title: JDGF Advanced RAG Engine
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version:
    type: string
    pattern: "^jdgf\\.io/v[0-9]+(alpha[0-9]+|beta[0-9]+)?$"
  contract_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"
  kind:
    const: RagEngine
  metadata:
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        const: advanced-rag-engine
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  spec:
    type: object
    additionalProperties: false
    required: [lifecycle, mission, capabilities]
    properties:
      lifecycle:
        enum: [specified, active, deprecated]
      mission:
        type: string
        minLength: 1
      capabilities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
