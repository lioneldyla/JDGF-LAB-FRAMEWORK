$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/orchestration-router.schema.yaml
title: JDGF Orchestration Router
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, routes, fallback]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: OrchestrationRouter}
  metadata:
    type: object
    additionalProperties: false
    required: [id, version, lifecycle]
    properties:
      id: {const: default-router}
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      lifecycle: {enum: [specified, active, deprecated]}
  routes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [intent, route_ref, enabled]
      properties:
        intent: {enum: [reasoning, coding, publication, governance, benchmark]}
        route_ref: {enum: [default-chat, coding, reasoning]}
        enabled: {type: boolean}
  fallback:
    type: object
    additionalProperties: false
    required: [enabled, route_ref]
    properties:
      enabled: {type: boolean}
      route_ref: {enum: [default-chat, coding, reasoning]}
