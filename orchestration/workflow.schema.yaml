$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/workflow.schema.yaml
title: JDGF Workflow Contract
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: Workflow}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version, lifecycle]
    properties:
      id: {$ref: "#/$defs/identifier"}
      name: {type: string, minLength: 1}
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  spec:
    type: object
    additionalProperties: false
    required: [enabled, mode, trigger, side_effects, human_approval_required, steps]
    properties:
      enabled: {type: boolean}
      mode: {enum: [sequential, parallel, conditional, event-driven]}
      trigger: {const: manual}
      side_effects: {type: boolean}
      human_approval_required: {const: true}
      steps:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, handler, dependencies]
          properties:
            id: {$ref: "#/$defs/identifier"}
            handler:
              type: string
              pattern: "^(agent|service|human|internal):[a-z][a-z0-9-]{2,62}$"
            dependencies:
              type: array
              uniqueItems: true
              items: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
