$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/orchestrator.schema.yaml
title: JDGF Orchestrator Contract
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: Orchestrator}
  metadata:
    type: object
    additionalProperties: false
    required: [id, version, owner, description, lifecycle]
    properties:
      id: {$ref: "#/$defs/identifier"}
      version: {$ref: "#/$defs/version"}
      owner: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
      lifecycle: {enum: [specified, active, deprecated]}
  spec:
    type: object
    additionalProperties: false
    required: [enabled, router, workflow_registry, roles, memory, audit, monitoring, execution]
    properties:
      enabled: {type: boolean}
      router: {const: orchestration/router.yaml}
      workflow_registry: {const: registry/workflows.yaml}
      roles:
        type: object
        additionalProperties: false
        required: [planner, executor, reviewer, publisher]
        properties:
          planner: {$ref: "#/$defs/role"}
          executor: {$ref: "#/$defs/role"}
          reviewer: {$ref: "#/$defs/role"}
          publisher: {$ref: "#/$defs/role"}
      memory:
        type: object
        additionalProperties: false
        required: [short_term, long_term, vector, graph]
        properties:
          short_term: {const: false}
          long_term: {const: false}
          vector: {const: false}
          graph: {const: false}
      audit:
        type: object
        additionalProperties: false
        required: [required, enabled, sink]
        properties:
          required: {const: true}
          enabled: {const: false}
          sink: {type: "null"}
      monitoring:
        type: object
        additionalProperties: false
        required: [enabled]
        properties:
          enabled: {const: false}
      execution:
        type: object
        additionalProperties: false
        required: [unattended, recursive, max_concurrency, human_approval_required]
        properties:
          unattended: {const: false}
          recursive: {const: false}
          max_concurrency: {const: 1}
          human_approval_required: {const: true}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  role:
    type: object
    additionalProperties: false
    required: [enabled, agent_ref]
    properties:
      enabled: {const: false}
      agent_ref: {$ref: "#/$defs/identifier"}
