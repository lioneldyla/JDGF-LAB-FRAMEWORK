api_version: jdgf.io/v1alpha1
contract_version: "1.0"
kind: Workflow
metadata:
  id: project
  name: Project Lifecycle Review
  version: 1.0.0
  lifecycle: specified
spec:
  enabled: false
  mode: sequential
  trigger: manual
  side_effects: false
  human_approval_required: true
  steps:
    - {id: inspect, handler: internal:project-validation, dependencies: []}
    - {id: review, handler: agent:jdgf-architect, dependencies: [inspect]}
    - {id: approve, handler: human:lifecycle-gate, dependencies: [review]}
