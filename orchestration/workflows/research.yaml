api_version: jdgf.io/v1alpha1
contract_version: "1.0"
kind: Workflow
metadata:
  id: research
  name: Research Review
  version: 1.0.0
  lifecycle: specified
spec:
  enabled: false
  mode: sequential
  trigger: manual
  side_effects: false
  human_approval_required: true
  steps:
    - {id: plan, handler: agent:research-architect, dependencies: []}
    - {id: retrieve, handler: agent:research-architect, dependencies: [plan]}
    - {id: benchmark, handler: agent:benchmark-agent, dependencies: [retrieve]}
    - {id: draft, handler: agent:publication-agent, dependencies: [benchmark]}
    - {id: approve, handler: human:review-gate, dependencies: [draft]}
