$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/sdk.schema.yaml
title: JDGF SDK Definition
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: SdkDefinition}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [active, deprecated]}
  spec:
    type: object
    additionalProperties: false
    required: [entry_point, generators, safety]
    properties:
      entry_point: {const: jdgf}
      generators:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, lifecycle, output_root, contract]
          properties:
            id: {enum: [project, agent, module, plugin, workflow]}
            lifecycle: {enum: [active, deferred]}
            output_root: {$ref: "#/$defs/path"}
            contract:
              oneOf:
                - {$ref: "#/$defs/path"}
                - {type: "null"}
      safety:
        type: object
        additionalProperties: false
        required: [path_confinement, atomic_writes, overwrite, auto_register]
        properties:
          path_confinement: {const: true}
          atomic_writes: {const: true}
          overwrite: {const: false}
          auto_register: {const: false}
$defs:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  path:
    type: string
    pattern: "^[A-Za-z0-9._/-]+$"
