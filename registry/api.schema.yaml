$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/api-registry.schema.yaml
title: JDGF Local API Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, endpoints]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: ApiRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {const: preview}
  endpoints:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, method, path, mutating, authentication]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9-]{2,62}$"}
        method: {enum: [GET, POST]}
        path: {type: string, pattern: "^/(?:healthz|api/v1/[a-z0-9/-]+)$"}
        mutating: {const: false}
        authentication: {const: none}
