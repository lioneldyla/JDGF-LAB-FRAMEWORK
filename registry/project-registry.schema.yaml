$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/project-registry.schema.yaml
title: JDGF Project Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, projects]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: ProjectRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  projects:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, lifecycle, manifest]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        lifecycle: {enum: [proposed, active, paused, retired]}
        manifest:
          type: string
          pattern: "^projects/[A-Za-z0-9_-]+/project\\.yaml$"
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
