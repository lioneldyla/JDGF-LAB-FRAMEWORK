$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/project-registry.schema.yaml
title: JDGF Project Registry
type: object
additionalProperties: false
required: [api_version, kind, projects]
properties:
  api_version:
    const: jdgf.io/v1alpha1
  kind:
    const: ProjectRegistry
  projects:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, manifest]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
        manifest:
          type: string
          minLength: 1
