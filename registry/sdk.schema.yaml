$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/sdk-registry.schema.yaml
title: JDGF SDK Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, definition, capabilities]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: SdkRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {enum: [active, deprecated]}
  definition: {const: sdk/sdk.yaml}
  capabilities:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, lifecycle, command]
      properties:
        id: {enum: [project, agent, module, plugin, workflow]}
        lifecycle: {enum: [active, deferred]}
        command:
          oneOf:
            - {type: string, pattern: "^jdgf [a-z-]+$"}
            - {type: "null"}
