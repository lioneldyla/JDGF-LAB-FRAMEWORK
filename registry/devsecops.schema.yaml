$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/devsecops-registry.schema.yaml
title: JDGF DevSecOps Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, workflows, tools]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: DevSecOpsRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  workflows:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, path, triggers, enabled, permissions, publishes, deploys]
      properties:
        id: {$ref: "#/$defs/identifier"}
        path: {type: string, pattern: "^\\.github/workflows/[a-z][a-z0-9-]*\\.yml$"}
        triggers:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [push, pull_request, workflow_dispatch]}
        enabled: {type: boolean}
        permissions: {const: contents-read}
        publishes: {const: false}
        deploys: {const: false}
  tools:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, purpose]
      properties:
        id: {enum: [uv, pytest, ruff, mypy, pip-audit, bash]}
        purpose: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
