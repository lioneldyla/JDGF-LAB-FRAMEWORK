$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/document-processing-registry.schema.yaml
title: JDGF Document Processing Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, engine, connectors]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: DocumentProcessingRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {enum: [active, deprecated]}
  engine: {const: platform/document-processing/engine.yaml}
  connectors:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, lifecycle, enabled]
      properties:
        id: {enum: [local-filesystem, github, google-drive, notion, sharepoint, web]}
        lifecycle: {enum: [active, deferred]}
        enabled: {type: boolean}
