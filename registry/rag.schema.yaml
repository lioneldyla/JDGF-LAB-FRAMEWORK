$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/rag-registry.schema.yaml
title: JDGF RAG Registry
type: object
additionalProperties: false
required:
  - api_version
  - contract_version
  - kind
  - metadata
  - capabilities
  - dependencies
  - components
properties:
  api_version:
    type: string
    pattern: "^jdgf\\.io/v[0-9]+(alpha[0-9]+|beta[0-9]+)?$"
  contract_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"
  kind:
    const: RagRegistry
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle, maturity]
    properties:
      version: {$ref: "#/$defs/semantic_version"}
      lifecycle: {enum: [specified, active, deprecated]}
      maturity: {enum: [experimental, preview, stable, deprecated]}
  capabilities:
    $ref: "#/$defs/identifier_list"
  dependencies:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, type, required_for_runtime, status]
      properties:
        id: {$ref: "#/$defs/identifier"}
        type:
          enum: [source-adapter, vector-adapter, graph-adapter, memory-adapter, model-adapter]
        required_for_runtime: {type: boolean}
        status: {enum: [unavailable, available, deprecated]}
  components:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, kind, version, maturity, config, capabilities, dependencies]
      properties:
        id: {$ref: "#/$defs/identifier"}
        kind:
          enum:
            - RagRetriever
            - RagReranker
            - RagContextBuilder
            - RagCitationEngine
            - RagMemoryManager
            - RagGraphRetriever
            - RagPromptComposer
            - RagValidationEngine
            - RagConfidenceScoring
        version: {$ref: "#/$defs/semantic_version"}
        maturity: {enum: [experimental, preview, stable, deprecated]}
        config:
          type: string
          pattern: "^platform/rag/[a-z0-9-]+\\.yaml$"
        capabilities: {$ref: "#/$defs/identifier_list"}
        dependencies:
          type: array
          uniqueItems: true
          items: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  identifier_list:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: "#/$defs/identifier"}
  semantic_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
