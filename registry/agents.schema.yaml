$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/agents.schema.yaml
title: JDGF Agent Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, agents]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: AgentRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  agents:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, lifecycle, enabled, route_ref, manifest]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        lifecycle: {enum: [specified, active, deprecated]}
        enabled: {type: boolean}
        route_ref: {enum: [default-chat, coding, reasoning]}
        manifest:
          type: string
          pattern: "^agents/[a-z][a-z0-9_]*/agent\\.yaml$"
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
