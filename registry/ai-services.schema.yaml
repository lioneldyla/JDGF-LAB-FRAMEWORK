$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/ai-services.schema.yaml
title: JDGF AI Service Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, services, routing]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: AiServiceRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  services:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, lifecycle, enabled, role, endpoint, dependencies]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        lifecycle: {enum: [specified, active, deprecated]}
        enabled: {type: boolean}
        role: {enum: [model-runtime, model-gateway, user-interface, software-agent]}
        endpoint:
          type: string
          pattern: "^http://[a-z][a-z0-9-]+:[0-9]+$"
        dependencies:
          type: array
          uniqueItems: true
          items: {$ref: "#/$defs/identifier"}
  routing:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, gateway, model_alias]
      properties:
        id: {$ref: "#/$defs/identifier"}
        gateway: {const: litellm}
        model_alias: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
