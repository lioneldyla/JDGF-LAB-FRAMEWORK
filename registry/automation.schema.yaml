$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/automation.schema.yaml
title: JDGF Automation and Monitoring Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, services]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: AutomationMonitoringRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  services:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, category, lifecycle, enabled, endpoint, dependencies]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[a-z0-9]+)?$"
        category: {enum: [automation, search, metrics, visualization, logging]}
        lifecycle: {enum: [specified, active, deprecated]}
        enabled: {type: boolean}
        endpoint:
          type: string
          pattern: "^http://[a-z][a-z0-9-]*:[0-9]{2,5}$"
        dependencies:
          type: array
          uniqueItems: true
          items: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
