$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/governance-registry.schema.yaml
title: JDGF Governance Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, framework, policies]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: GovernanceRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  framework: {const: governance/governance.yaml}
  policies:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, status, enabled, manifest]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        status: {enum: [draft, review, approved, deprecated, archived]}
        enabled: {type: boolean}
        manifest:
          type: string
          pattern: "^governance/policies/[a-z][a-z0-9-]*\\.yaml$"
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
