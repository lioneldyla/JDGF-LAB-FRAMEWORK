$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/runtime-registry.schema.yaml
title: JDGF Runtime Component Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, profile, components]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: RuntimeRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {const: specified}
  profile: {const: runtime/runtime.yaml}
  components:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, lifecycle, enabled]
      properties:
        id: {enum: [lifecycle-controller, planner, supervisor, executor, reviewer, publisher, scheduler, model-router, event-bus]}
        lifecycle: {enum: [active, deferred]}
        enabled: {type: boolean}
