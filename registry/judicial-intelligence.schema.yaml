$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/judicial-intelligence-registry.schema.yaml
title: JDGF Judicial Intelligence Extension Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, extensions]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: ExtensionRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      lifecycle: {enum: [specified, deprecated]}
  extensions:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, lifecycle, enabled, profile]
      properties:
        id: {const: judicial-intelligence}
        lifecycle: {enum: [specified, deprecated]}
        enabled: {const: false}
        profile: {const: platform/judicial-intelligence/profile.yaml}
