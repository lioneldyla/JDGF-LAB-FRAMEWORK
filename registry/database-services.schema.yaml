$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/database-services.schema.yaml
title: JDGF Database Service Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, services, connections]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: DatabaseServiceRegistry}
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
  services:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, type, lifecycle, enabled, endpoint, dependencies]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        type: {enum: [relational, graph, vector, cache]}
        lifecycle: {enum: [specified, active, deprecated]}
        enabled: {type: boolean}
        endpoint:
          type: string
          pattern: "^(postgresql|bolt|http|redis)://\\S+$"
        dependencies:
          type: array
          uniqueItems: true
          items: {$ref: "#/$defs/identifier"}
  connections:
    type: object
    additionalProperties: false
    required: [default_sql, default_graph, default_vector, default_cache]
    properties:
      default_sql: {$ref: "#/$defs/identifier"}
      default_graph: {$ref: "#/$defs/identifier"}
      default_vector: {$ref: "#/$defs/identifier"}
      default_cache: {$ref: "#/$defs/identifier"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
