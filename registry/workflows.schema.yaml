$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/workflows.schema.yaml
title: JDGF Workflow Registry
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, workflows]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: WorkflowRegistry}
  metadata: {$ref: "#/$defs/metadata"}
  workflows:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, version, lifecycle, enabled, manifest]
      properties:
        id: {$ref: "#/$defs/identifier"}
        version: {$ref: "#/$defs/version"}
        lifecycle: {enum: [specified, active, deprecated]}
        enabled: {type: boolean}
        manifest:
          type: string
          pattern: "^orchestration/workflows/[a-z][a-z0-9-]*\\.yaml$"
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  metadata:
    type: object
    additionalProperties: false
    required: [version, lifecycle]
    properties:
      version: {$ref: "#/$defs/version"}
      lifecycle: {enum: [specified, active, deprecated]}
