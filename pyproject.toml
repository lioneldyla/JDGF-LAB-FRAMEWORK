[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "jdgf-lab-framework"
version = "0.10.0"
description = "Governed, manifest-driven foundation for AI-assisted projects"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.138.0",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.4.0",
  "pip-audit==2.10.1",
  "pytest>=8,<9",
  "ruff==0.15.20",
]

[project.scripts]
jdgf = "jdgf_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jdgf_framework"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/jdgf_framework",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
