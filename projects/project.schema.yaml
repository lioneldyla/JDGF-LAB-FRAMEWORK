$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/project.schema.yaml
title: JDGF Project
type: object
additionalProperties: false
required: [api_version, contract_version, kind, metadata, spec]
properties:
  api_version: {const: jdgf.io/v1alpha1}
  contract_version: {const: "1.0"}
  kind: {const: Project}
  metadata:
    type: object
    additionalProperties: false
    required: [id, name, version, description, license]
    properties:
      id: {$ref: "#/$defs/identifier"}
      name: {type: string, minLength: 1, maxLength: 200}
      short_name: {type: string, minLength: 1, maxLength: 50}
      version: {$ref: "#/$defs/version"}
      description: {type: string, minLength: 1, maxLength: 1000}
      repository: {type: string, format: uri}
      license: {type: string, minLength: 1, maxLength: 100}
  spec:
    type: object
    additionalProperties: false
    required:
      - lifecycle
      - owner
      - governance
      - architecture
      - capabilities
      - timeline
      - documentation
    properties:
      lifecycle: {enum: [proposed, active, paused, retired, template]}
      owner: {type: string, minLength: 1, maxLength: 200}
      governance:
        type: object
        additionalProperties: false
        required: [human_approval_required, roles]
        properties:
          human_approval_required: {type: boolean}
          roles:
            type: object
            additionalProperties: false
            properties:
              technical_lead: {type: string, minLength: 1}
              product_owner: {type: string, minLength: 1}
              steering_committee:
                type: array
                uniqueItems: true
                items: {type: string, minLength: 1}
      architecture:
        type: object
        additionalProperties: false
        required: [modules, services, dependencies, datasets, knowledge, agents]
        properties:
          modules: {$ref: "#/$defs/identifier_list"}
          services: {$ref: "#/$defs/identifier_list"}
          dependencies: {$ref: "#/$defs/identifier_list"}
          datasets: {$ref: "#/$defs/identifier_list"}
          knowledge: {$ref: "#/$defs/identifier_list"}
          agents: {$ref: "#/$defs/identifier_list"}
      capabilities: {$ref: "#/$defs/identifier_list"}
      timeline:
        type: object
        additionalProperties: false
        required: [created, updated, release]
        properties:
          created: {type: string, format: date}
          updated: {type: string, format: date}
          release: {$ref: "#/$defs/version"}
          roadmap: {$ref: "#/$defs/path"}
      documentation:
        type: object
        additionalProperties: false
        required: [readme]
        properties:
          readme: {$ref: "#/$defs/path"}
          architecture: {$ref: "#/$defs/path"}
          changelog: {$ref: "#/$defs/path"}
          decisions: {$ref: "#/$defs/path"}
          standards: {$ref: "#/$defs/path"}
$defs:
  identifier:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,62}$"
  identifier_list:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/identifier"}
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  path:
    type: string
    minLength: 1
    pattern: "^[A-Za-z0-9._/-]+$"
