$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jdgf.io/schemas/project.schema.yaml
title: JDGF Project
type: object
additionalProperties: false
required: [api_version, kind, metadata, spec]
properties:
  api_version:
    const: jdgf.io/v1alpha1
  kind:
    const: Project
  metadata:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,62}$"
      name:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
  spec:
    type: object
    additionalProperties: false
    required: [lifecycle, owner, governance]
    properties:
      lifecycle:
        enum: [proposed, active, paused, retired, template]
      owner:
        type: string
        minLength: 1
      governance:
        type: object
        additionalProperties: false
        required: [human_approval_required]
        properties:
          human_approval_required:
            type: boolean
      capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,62}$"
