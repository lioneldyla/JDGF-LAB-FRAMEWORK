api_version: jdgf.io/v1alpha1
contract_version: "1.0"
kind: AgentProfile
metadata:
  id: data-governance-agent
  name: Data Governance Agent
  description: Reviews metadata, lineage, quality and stewardship declarations.
  version: 1.0.0
  owner: JDGF Lab Framework contributors
  lifecycle: specified
spec:
  enabled: false
  purpose: Produce supervised governance findings without modifying source data.
  route_ref: reasoning
  capabilities: [planning, reasoning, retrieval, data-governance, documentation]
  tools:
    - {id: filesystem, enabled: false, access: read}
    - {id: database, enabled: false, access: read}
  memory:
    short_term: {enabled: false, adapter: redis}
    long_term: {enabled: false, adapter: null}
    vector_store: {enabled: false, adapter: qdrant}
    graph_store: {enabled: false, adapter: neo4j}
  permissions:
    read: [repository, metadata]
    write: []
    execute: []
    delete: false
    external_actions: false
  execution:
    mode: supervised
    unattended: false
    network_access: false
    human_approval_required: true
