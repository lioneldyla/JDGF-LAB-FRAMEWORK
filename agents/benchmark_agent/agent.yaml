api_version: jdgf.io/v1alpha1
contract_version: "1.0"
kind: AgentProfile
metadata:
  id: benchmark-agent
  name: Benchmark Agent
  description: Defines evidence-backed comparison criteria and scoring plans.
  version: 1.0.0
  owner: JDGF Lab Framework contributors
  lifecycle: specified
spec:
  enabled: false
  purpose: Produce supervised benchmark designs without external data collection.
  route_ref: reasoning
  capabilities: [planning, reasoning, retrieval, benchmarking, documentation]
  tools:
    - {id: filesystem, enabled: false, access: read}
    - {id: rag, enabled: false, access: read}
  memory:
    short_term: {enabled: false, adapter: redis}
    long_term: {enabled: false, adapter: null}
    vector_store: {enabled: false, adapter: qdrant}
    graph_store: {enabled: false, adapter: neo4j}
  permissions:
    read: [repository, knowledge]
    write: []
    execute: []
    delete: false
    external_actions: false
  execution:
    mode: supervised
    unattended: false
    network_access: false
    human_approval_required: true
