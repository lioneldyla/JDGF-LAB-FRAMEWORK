api_version: jdgf.io/v1alpha1
contract_version: "1.0"
kind: AgentProfile
metadata:
  id: coding-agent
  name: Coding Agent
  description: Proposes code changes and tests under explicit human supervision.
  version: 1.0.0
  owner: JDGF Lab Framework contributors
  lifecycle: specified
spec:
  enabled: false
  purpose: Draft implementation patches without autonomous execution or writes.
  route_ref: coding
  capabilities: [planning, reasoning, coding, documentation]
  tools:
    - {id: filesystem, enabled: false, access: write}
    - {id: git, enabled: false, access: write}
    - {id: shell, enabled: false, access: execute}
    - {id: docker, enabled: false, access: execute}
  memory:
    short_term: {enabled: false, adapter: redis}
    long_term: {enabled: false, adapter: null}
    vector_store: {enabled: false, adapter: qdrant}
    graph_store: {enabled: false, adapter: null}
  permissions:
    read: [repository, contracts]
    write: []
    execute: []
    delete: false
    external_actions: false
  execution:
    mode: supervised
    unattended: false
    network_access: false
    human_approval_required: true
