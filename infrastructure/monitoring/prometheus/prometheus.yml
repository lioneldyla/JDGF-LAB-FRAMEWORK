global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: [n8n:5678]
