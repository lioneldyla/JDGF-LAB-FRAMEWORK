use_default_settings: true

general:
  debug: false
  instance_name: JDGF Local Search

search:
  safe_search: 1
  formats: [html, json]

server:
  limiter: true
  image_proxy: true
  public_instance: false
  method: POST
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer
