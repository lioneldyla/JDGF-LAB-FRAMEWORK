services:
  searxng:
    image: ${SEARXNG_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: redis://:${REDIS_PASSWORD}@${SEARXNG_REDIS_HOST:-redis}:6379/1
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - jdgf-network

volumes:
  searxng-cache:
    name: ${SEARXNG_CACHE_VOLUME:-jdgf-searxng-cache}

networks:
  jdgf-network:
    external: true
    name: ${JDGF_NETWORK:-jdgf-network}
