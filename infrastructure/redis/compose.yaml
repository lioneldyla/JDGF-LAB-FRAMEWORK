services:
  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        exec redis-server --appendonly yes --protected-mode yes
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - jdgf-network

volumes:
  redis-data:
    name: ${REDIS_VOLUME:-jdgf-redis-data}

networks:
  jdgf-network:
    external: true
    name: ${JDGF_NETWORK:-jdgf-network}
