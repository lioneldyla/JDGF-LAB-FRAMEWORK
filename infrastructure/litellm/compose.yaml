services:
  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    command: [--config, /app/config.yaml, --port, "4000"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - jdgf-network

networks:
  jdgf-network:
    external: true
    name: ${JDGF_NETWORK:-jdgf-network}
