services:
  qdrant:
    image: ${QDRANT_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_CORS: "false"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - jdgf-network

volumes:
  qdrant-data:
    name: ${QDRANT_VOLUME:-jdgf-qdrant-data}

networks:
  jdgf-network:
    external: true
    name: ${JDGF_NETWORK:-jdgf-network}
